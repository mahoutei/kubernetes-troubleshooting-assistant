[project]
name = "rag-k8s-docs"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "numpy>=1.26",
  "lancedb>=0.15",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
  "transformers>=4.45",
  "openai>=1.40",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
