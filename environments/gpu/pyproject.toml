[project]
name = "llm-portfolio-gpu"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Isolated NVIDIA CUDA training environment; not used by CPU checks"
dependencies = [
  "torch>=2.8",
  "torchvision",
  "unsloth",
  "trl>=0.19,<0.25",
  "peft>=0.13",
  "transformers>=4.51,<5",
  "datasets>=2.20",
  "accelerate>=1.0",
  "bitsandbytes>=0.43",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
