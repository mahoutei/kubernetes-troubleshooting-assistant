name: rag

on:
  push:
    paths: ["projects/01-rag-k8s-docs/**", ".github/workflows/rag.yml", "scripts/**", "environments/gpu/**", "tests/**", "pyproject.toml", "uv.lock", ".python-version"]
  pull_request:
    paths: ["projects/01-rag-k8s-docs/**", ".github/workflows/rag.yml", "scripts/**", "environments/gpu/**", "tests/**", "pyproject.toml", "uv.lock", ".python-version"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/dev.py check --project rag
